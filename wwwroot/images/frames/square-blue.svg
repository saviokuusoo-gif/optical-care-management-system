<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 208" width="360" height="208" role="img" aria-label="Blue Square eyeglass frame">
  <defs>
    <linearGradient id="lens" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eaf1fb" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1f4e8c"/>
      <stop offset="100%" stop-color="#14345e"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="360" height="208" fill="#ffffff"/>

  <g filter="url(#soft)">
    <!-- temples folding back behind the lenses -->
    <path d="M44,92 C26,84 14,86 6,96" fill="none" stroke="url(#metal)" stroke-width="7" stroke-linecap="round"/>
    <path d="M316,92 C334,84 346,86 354,96" fill="none" stroke="url(#metal)" stroke-width="7" stroke-linecap="round"/>

    <!-- bridge -->
    <path d="M158,90 C168,76 192,76 202,90" fill="none" stroke="url(#metal)" stroke-width="8" stroke-linecap="round"/>

    <!-- lenses -->
    <g fill="url(#lens)" stroke="url(#metal)" stroke-width="9" stroke-linejoin="round">
      <rect x="42" y="60.0" width="118" height="88" rx="14" />
      <rect x="200" y="60.0" width="118" height="88" rx="14" />
    </g>
  </g>
</svg>
